
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas del estudiante</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor">
        <h1>Registro de estudiantes</h1>

        <form id="formulario">

            <label>Nombre del estudiante:</label>
            <input type="text" id="nombre" placeholder="Ingrese el nombre" required>

            <label>Apellido del estudiante:</label>
            <input type="text" id="apellido" placeholder="Ingrese el apellido" required>

            <h3>Ingrese las 5 notas</h3>

            <input type="number" id="nota1" placeholder="Nota 1" min="0" max="5" step="0.1" required>
            <input type="number" id="nota2" placeholder="Nota 2" min="0" max="5" step="0.1" required>
            <input type="number" id="nota3" placeholder="Nota 3" min="0" max="5" step="0.1" required>
            <input type="number" id="nota4" placeholder="Nota 4" min="0" max="5" step="0.1" required>
            <input type="number" id="nota5" placeholder="Nota 5" min="0" max="5" step="0.1" required>

            <button type="submit">Calcular promedio</button>

        </form>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
